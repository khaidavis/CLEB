spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/platform
spring.datasource.username=platform_user
spring.datasource.password=myS3cret_platform_pw

# CHANGED: none -> update. Hibernate now creates/updates tables to match your
# @Entity classes on startup. Great for learning — you add a class, the table
# appears. (In real production you'd use a migration tool like Flyway instead,
# because 'update' can't safely handle every change. We'll get there later.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
