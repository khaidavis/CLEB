spring.application.name=backend

# The host assigns the port in the cloud; default to 8080 locally.
server.port=${PORT:8080}

# Database comes from the environment in the cloud; defaults are for local dev.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:platform_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:myS3cret_platform_pw}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
